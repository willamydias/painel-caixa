name: painel-caixa-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  supabase-net:
    name: supabase-net
    external: true

services:
  painel-imobiliario:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: painel-imobiliario-app
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${PORT:-3050}:3050"
    volumes:
      - ../../webscrap/data/ativos:/app/public/data/ativos:ro
      - ../../webscrap/data/reports:/app/public/data/reports:ro
    env_file:
      - .env
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3050/api/health > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    environment:
      - PORT=3050
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      # Conexão Primária (Local Docker Supabase Container)
      - DATABASE_URL_PRIMARY=${DATABASE_URL_PRIMARY:-postgresql://postgres:L3il0jus_P4ssW0rd!2026@supabase-db:5432/postgres}
      # Conexão Secundária (Redundância em Nuvem Supabase / Replica)
      - DATABASE_URL_SECONDARY=${DATABASE_URL_SECONDARY:-postgresql://postgres.qrgkzvmxsrsdtrtqowep:L3il0jus_P4ssW0rd%212026@aws-1-sa-east-1.pooler.supabase.com:6543/postgres}
      # Integração com API Gateway & Nuvem Supabase
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:8000}
      - SUPABASE_INTERNAL_URL=${SUPABASE_INTERNAL_URL:-http://supabase-rest:3000}
      - SUPABASE_CLOUD_URL=${SUPABASE_CLOUD_URL:-https://qrgkzvmxsrsdtrtqowep.supabase.co}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_phQodeJ6UNHD4P4ITBX2UQ_XIoGYas5}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-sb_secret_hjger41NNtaNZpqtbq4fgw_c6D9wAH8}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:-https://qrgkzvmxsrsdtrtqowep.supabase.co/auth/v1/.well-known/jwks.json}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjIwNTAwMDAwMDB9.bl88-wO2IxIfDw-d2LT7Xx6T5g_oY216PU4hPCJZouw}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - supabase-net
